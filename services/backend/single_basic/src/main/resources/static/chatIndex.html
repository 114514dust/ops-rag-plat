<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .chat-container {
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-body {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.4;
        }

        .user-message {
            background-color: #e3f2fd;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: #f1f1f1;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input {
            display: flex;
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 0 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .chat-input button:hover {
            background-color: #45a049;
        }

        .typing-indicator {
            display: inline-block;
            width: 40px;
            height: 20px;
            position: relative;
        }

        .typing-indicator span {
            position: absolute;
            top: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #999;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            left: 0;
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            left: 16px;
            animation-delay: -0.16s;
        }

        .typing-indicator span:nth-child(3) {
            left: 32px;
        }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        AI对话助手
    </div>
    <div class="chat-body" id="chatBody">
        <!-- 对话消息将在这里显示 -->
    </div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="输入消息..." />
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    let memoryId = "1"; // 默认memoryId
    let currentMessageId = 0;

    // 发送消息
    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const message = messageInput.value.trim();

        if (!message) return;

        // 添加用户消息到界面
        addMessage('user', message);
        messageInput.value = '';

        // 显示AI正在输入
        const aiMessageId = `ai-${++currentMessageId}`;
        addTypingIndicator(aiMessageId);

        // 调用后端流式接口
        fetchStream(message, aiMessageId);
    }

    // 添加消息到界面
    function addMessage(type, content) {
        const chatBody = document.getElementById('chatBody');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}-message`;
        messageDiv.textContent = content;
        chatBody.appendChild(messageDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // 添加输入指示器
    function addTypingIndicator(id) {
        const chatBody = document.getElementById('chatBody');
        const typingDiv = document.createElement('div');
        typingDiv.id = id;
        typingDiv.className = 'message ai-message';
        typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
        chatBody.appendChild(typingDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // 流式获取AI回复
    function fetchStream(message, aiMessageId) {
        const url = `http://localhost:8080/chat/stream?memoryId=${encodeURIComponent(memoryId)}&message=${encodeURIComponent(message)}`;

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiResponse = '';
                const aiMessageElement = document.getElementById(aiMessageId);

                // 处理流式响应
                function processText({ done, value }) {
                    if (done) {
                        // 完成时移除输入指示器，显示完整回复
                        if (aiMessageElement) {
                            aiMessageElement.innerHTML = aiResponse;
                        }
                        return;
                    }

                    // 解码并添加到响应中
                    const chunk = decoder.decode(value, { stream: true });
                    aiResponse += chunk;

                    // 更新UI显示
                    if (aiMessageElement) {
                        aiMessageElement.innerHTML = aiResponse;
                        document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
                    }

                    // 继续读取下一个块
                    return reader.read().then(processText);
                }

                return reader.read().then(processText);
            })
            .catch(error => {
                console.error('Error:', error);
                const aiMessageElement = document.getElementById(aiMessageId);
                if (aiMessageElement) {
                    aiMessageElement.innerHTML = '抱歉，发生了错误，请重试';
                }
            });
    }

    // 回车键发送消息
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // 初始化时发送欢迎消息
    window.onload = function() {
        setTimeout(() => {
            addMessage('ai', '你好！我是AI助手，有什么可以帮你的吗？');
        }, 500);
    };
</script>
</body>
</html>
