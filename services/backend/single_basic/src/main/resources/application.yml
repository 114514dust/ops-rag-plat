server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${database.url}:${database.port}/${database.name}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${database.username}
    password: ${database.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${redis.url}
      port: ${redis.port}

  profiles:
    active: local
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.opsrag.backend.pojo
  configuration:
    map-underscore-to-camel-case: true

# 日志配置
logging:
  level:
    com.opsrag.backend: info
jwt:
  secret: 123456
  expire-time: 36000000000 # 1小时

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      model-name: qwen-plus
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${OPENAI_API_KEY}
      model-name: qwen-plus
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
    embedding-model:
      api-key: ${OPENAI_API_KEY}
      model-name: text-embedding-v1
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true

ai:
  message:
    size: 10 #上下文窗口最大为10


springdoc:
  # API文档路径配置
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

knife4j:
  # 开启Knife4j增强功能（必须）
  enable: true
  # 生产环境设为true（开发环境填false）
  production: false
  # UI界面语言
  setting:
    language: zh-CN
    # 开启Swagger模型展示
    enable-swagger-models: true
    swagger-model-name: 实体类列表
